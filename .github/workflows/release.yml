name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (select the same tag as workflow ref)'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  DEFAULT_TAGS: "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_v2ray_api,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_xhttp,with_awg"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release revision
        id: resolve
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-vpnctl\.[0-9]+$ ]]
          SHA=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          test "$SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > released-tags
          if grep -Fxq "$TAG" released-tags; then
            echo 'Refusing to replace an existing release' >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # 1. Build Windows Binaries (amd64, arm64)
  # --------------------------------------------------------------------------
  build-windows:
    needs: resolve
    name: Build Windows (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, asset: windows-amd64 }
          - { goarch: arm64, asset: windows-arm64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Resolve Version
        id: ver
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -tags "$DEFAULT_TAGS" \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${{ steps.ver.outputs.version }}" \
            -o dist/sing-box.exe ./cmd/sing-box

      - name: Package ZIP
        run: |
          NAME="sing-box-${{ steps.ver.outputs.version }}-${{ matrix.asset }}"
          mkdir -p "pkg/$NAME"
          cp dist/sing-box.exe "pkg/$NAME/"
          cp LICENSE README.md "pkg/$NAME/" 2>/dev/null || true
          cd pkg
          zip -r "../dist/$NAME.zip" "$NAME"
          cd ..
          rm -rf pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.goarch }}
          path: dist/*.zip

  # --------------------------------------------------------------------------
  # 2. Build Linux Binaries (amd64, arm64, armv7)
  # --------------------------------------------------------------------------
  build-linux:
    needs: resolve
    name: Build Linux (${{ matrix.asset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, goarm: "", asset: linux-amd64 }
          - { goarch: arm64, goarm: "", asset: linux-arm64 }
          - { goarch: arm, goarm: "7", asset: linux-armv7 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Resolve Version
        id: ver
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build Binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -tags "$DEFAULT_TAGS" \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${{ steps.ver.outputs.version }}" \
            -o dist/sing-box ./cmd/sing-box

      - name: Package Tarball
        run: |
          NAME="sing-box-${{ steps.ver.outputs.version }}-${{ matrix.asset }}"
          mkdir -p "pkg/$NAME"
          cp dist/sing-box "pkg/$NAME/"
          cp LICENSE README.md "pkg/$NAME/" 2>/dev/null || true
          tar -czf "dist/$NAME.tar.gz" -C pkg "$NAME"
          rm -rf pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*.tar.gz

  # --------------------------------------------------------------------------
  # 3. Build macOS Universal Binary (amd64 + arm64 lipo)
  # --------------------------------------------------------------------------
  build-darwin:
    needs: resolve
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Resolve Version
        id: ver
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build macOS amd64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath \
            -tags "$DEFAULT_TAGS" \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${{ steps.ver.outputs.version }}" \
            -o dist/sing-box-amd64 ./cmd/sing-box

      - name: Build macOS arm64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -trimpath \
            -tags "$DEFAULT_TAGS" \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${{ steps.ver.outputs.version }}" \
            -o dist/sing-box-arm64 ./cmd/sing-box

      - name: Create Universal Binary
        run: |
          lipo -create -output dist/sing-box dist/sing-box-amd64 dist/sing-box-arm64
          rm dist/sing-box-amd64 dist/sing-box-arm64
          file dist/sing-box

      - name: Package Archives
        run: |
          NAME="sing-box-${{ steps.ver.outputs.version }}-darwin-universal"
          mkdir -p "pkg/$NAME"
          cp dist/sing-box "pkg/$NAME/"
          cp LICENSE README.md "pkg/$NAME/" 2>/dev/null || true
          tar -czf "dist/$NAME.tar.gz" -C pkg "$NAME"
          cd pkg
          zip -r "../dist/$NAME.zip" "$NAME"
          cd ..
          rm -rf pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-universal
          path: |
            dist/*.tar.gz
            dist/*.zip

  # --------------------------------------------------------------------------
  # 4. Build Android AAR (gomobile with_clash_api + with_awg + with_xhttp)
  # --------------------------------------------------------------------------
  build-android:
    needs: resolve
    name: Build Android (libbox.aar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup OpenJDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1 (peeled)
        with:
          ndk-version: r28

      - name: Resolve Version
        id: ver
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install gomobile tools
        run: |
          make lib_install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make lib_android

      - name: Stage AAR Artifacts
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          cp libbox.aar "dist/libbox-${V}.aar"
          cp libbox.aar "dist/libbox.aar"
          if [ -f libbox-legacy.aar ]; then
            cp libbox-legacy.aar "dist/libbox-legacy-${V}.aar"
            cp libbox-legacy.aar "dist/libbox-legacy.aar"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aar
          path: dist/*.aar

  # --------------------------------------------------------------------------
  # 5. Publish GitHub Release
  # --------------------------------------------------------------------------
  publish:
    name: Publish Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - resolve
      - build-windows
      - build-linux
      - build-darwin
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve Tag
        id: ver
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' asset; do
            name=$(basename "$asset")
            test ! -e "release-assets/$name"
            cp "$asset" "release-assets/$name"
          done < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.aar' \) -print0)
          cd release-assets
          echo "=== Collected Release Assets ==="
          ls -la
          echo "=== Generating Checksums ==="
          sha256sum * > SHA256SUMS
          for f in *; do
            if [ "$f" != "SHA256SUMS" ]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done
          cat SHA256SUMS

      - name: Attest release assets and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "${{ needs.resolve.outputs.sha }}"
          git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" > remote-tag
          REMOTE_SHA=$(awk 'END {print $1}' remote-tag)
          test "$REMOTE_SHA" = "${{ needs.resolve.outputs.sha }}"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > released-tags
          if grep -Fxq "$TAG" released-tags; then
            echo 'Refusing to replace an existing release' >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* --verify-tag \
            --title "sing-box-vpnctl ${TAG}" --generate-notes
