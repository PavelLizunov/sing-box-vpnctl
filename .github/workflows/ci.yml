name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Test vendored WireGuard device (separate Go module)
        working-directory: submodules/wireguard-go
        run: |
          go test -count=1 -timeout=180s ./device
          go test -race -count=1 -timeout=240s ./device

      - name: Test AWG transport integration
        run: go test -tags "with_awg,with_wireguard,with_gvisor" -ldflags="-checklinkname=0" -count=1 -timeout=180s ./transport/wireguard

      - name: Test security regressions
        run: |
          python3 release/security_workflow_test.py
          go test -race -tags with_awg -count=1 -timeout=180s ./option ./transport/wireguard ./transport/v2rayxhttp

      - name: Compile sing-box with production tags
        run: |
          go build -v -trimpath \
            -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_v2ray_api,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_xhttp,with_awg" \
            -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=ci-test" \
            -o sing-box ./cmd/sing-box

      - name: Verify build tags
        run: |
          ./sing-box version
          go version -m ./sing-box | grep -E 'build[[:space:]]+-tags='
          go version -m ./sing-box | grep -q "with_awg"
          go version -m ./sing-box | grep -q "with_xhttp"
          go version -m ./sing-box | grep -q "with_v2ray_api"

      - name: Validate configuration check
        run: |
          cat > test-config.json << 'EOF'
          {
            "log": { "level": "warn" },
            "experimental": {
              "clash_api": { "external_controller": "127.0.0.1:9090" }
            },
            "dns": {
              "servers": [
                { "tag": "remote-dns", "type": "https", "server": "1.1.1.1", "detour": "xhttp-out" },
                { "tag": "local-dns", "type": "local", "detour": "direct" }
              ],
              "rules": [
                { "query_type": ["HTTPS", "SVCB"], "action": "reject" }
              ],
              "final": "remote-dns"
            },
            "route": { "default_domain_resolver": "remote-dns" },
            "inbounds": [
              { "type": "mixed", "tag": "mixed-in", "listen": "127.0.0.1", "listen_port": 10808 }
            ],
            "endpoints": [
              {
                "type": "wireguard",
                "tag": "awg-ep",
                "address": ["10.0.0.2/32"],
                "private_key": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
                "peers": [{ "address": "198.51.100.1", "port": 51820, "public_key": "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=", "allowed_ips": ["0.0.0.0/0"] }],
                "jc": 4, "jmin": 40, "jmax": 70, "s1": 20, "s2": 30, "s3": 20, "s4": 30,
                "h1": 12345678, "h2": 23456789, "h3": 34567890, "h4": 45678901,
                "random_trailers": true, "disable_cookies": true,
                "header_protection_key": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
                "content_padding_addition": "10-50"
              }
            ],
            "outbounds": [
              {
                "type": "vless",
                "tag": "xhttp-out",
                "server": "example.com",
                "server_port": 443,
                "uuid": "00000000-0000-0000-0000-000000000000",
                "tls": { "enabled": true, "server_name": "example.com" },
                "transport": { "type": "xhttp", "path": "/xhttp", "mode": "auto" }
              },
              { "type": "direct", "tag": "direct" }
            ]
          }
          EOF
          ./sing-box check -c test-config.json
